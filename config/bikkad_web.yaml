# =====================================================================
# BIKKAD WEB GAME RECORDING & YOUTUBE PIPELINE CONFIGURATION
# BOLLYWOOD HEROES & LEGENDS EDITION
# =====================================================================

app:
  name: "Bikkad"
  mode: "web"
  url: "http://127.0.0.1:8000/?mode=record&deals=1"
  game_type: "bikkad"
  player_name: "Chulbul Pandey" # Default hero name
  player_names:
    - "Chulbul Pandey"
    - "Don"
    - "Veeru"
    - "Munna Bhai"
    - "Pushpa Raj"
    - "Kabir Singh"
    - "Mogambo"
    - "Baazigar"
    - "Bajirao"
    - "Sultan"
  play_duration_seconds: 300 # Max timeout: 5 mins (exits early as soon as match ends)
  deals_target: 1
  play_until_match_over: true
  turn_delay_ms: 1200
  auto_start_match: true

recorder:
  # Choose backend: 'playwright' (zero dependencies with automatic audio loopback), 'obs', or 'ffmpeg'
  backend: "playwright"
  resolution_width: 1920
  resolution_height: 1080
  fps: 60
  output_dir: "recordings"
  filename_template: "{app_slug}_{player_name}_{timestamp}.mp4"

  # OBS Studio WebSocket settings (used if backend: 'obs')
  obs:
    host: "localhost"
    port: 4455
    password: ""
    scene_name: ""

  # FFmpeg settings (used if backend: 'ffmpeg')
  ffmpeg:
    ffmpeg_path: "ffmpeg"
    video_device: "desktop"
    audio_device: null
    framerate: 30

